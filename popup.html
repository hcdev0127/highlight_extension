<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>BeBee Job Downloader</title>
  <style>
    body { width: 300px; margin: 0; padding: 16px; font: 14px Arial, sans-serif; }
    h3 { margin: 0 0 12px; }
    button { width: 100%; padding: 10px; border: 0; border-radius: 8px; cursor: pointer; }
    #start { background: #2563eb; color: white; }
    #stop { margin-top: 8px; background: #e5e7eb; }
    #status { margin-top: 12px; line-height: 1.4; color: #374151; word-break: break-word; }
  </style>
</head>
<body>
  <h3>BeBee Job Downloader</h3>
  <button id="start">Choose Folder & Start</button>
  <button id="stop">Stop</button>
  <div id="status">Open a BeBee jobs page first.</div>
  <script src="popup.js"></script>
</body>
</html>
